<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자리 배치</title>
<style>
body { font-family: Arial; text-align: center; }
.grid {
  display: grid;
  grid-template-columns: repeat(6, 100px);
  gap: 10px;
  justify-content: center;
  margin-top: 30px;
}
.seat {
  border: 2px solid #ccc;
  height: 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
}
.fixed { background: gold; }
.excluded { background: #ddd; }
</style>
</head>
<body>

<h2>자리 배치 랜덤 생성기</h2>

<button onclick="shuffle()">무작위 배치</button>
<button onclick="resetSeats()">초기화</button>

<p>👉 클릭: 고정 / 우클릭: 제외</p>

<div class="grid" id="grid"></div>

<script>
const students = Array.from({ length: 28 }, (_, i) => "학생 " + (i + 1));

const rows = 5;
const cols = 6;

let seats = [];

function init() {
  seats = [];
  for (let i = 0; i < rows * cols; i++) {
    let r = Math.floor(i / cols);
    let c = i % cols;

    let excluded = (r === rows - 1 && (c === 0 || c === 1));

    seats.push({
      student: null,
      fixed: false,
      excluded: excluded
    });
  }
  render();
}

function shuffle() {
  let pool = students.slice();

  seats.forEach(s => {
    if (s.fixed && s.student) {
      pool = pool.filter(x => x !== s.student);
    }
  });

  pool.sort(() => Math.random() - 0.5);

  let idx = 0;

  seats.forEach(s => {
    if (!s.fixed && !s.excluded) {
      s.student = pool[idx++] || null;
    }
  });

  render();
}

function toggleFixed(i) {
  if (seats[i].student && !seats[i].excluded) {
    seats[i].fixed = !seats[i].fixed;
    render();
  }
}

function toggleExcluded(i) {
  seats[i].excluded = !seats[i].excluded;
  if (seats[i].excluded) {
    seats[i].student = null;
    seats[i].fixed = false;
  }
  render();
}

function resetSeats() {
  seats.forEach(s => {
    if (!s.excluded) {
      s.student = null;
      s.fixed = false;
    }
  });
  render();
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  seats.forEach((s, i) => {
    let div = document.createElement("div");
    div.className = "seat";

    if (s.fixed) div.classList.add("fixed");
    if (s.excluded) div.classList.add("excluded");

    div.innerHTML = `
      ${s.excluded ? "사용 안함" : (s.student || "빈자리")}
      <div style="font-size:10px;">
        ${s.fixed ? "🔒고정" : ""}
      </div>
    `;

    div.onclick = () => toggleFixed(i);
    div.oncontextmenu = (e) => {
      e.preventDefault();
      toggleExcluded(i);
    };

    grid.appendChild(div);
  });
}

init();
</script>

</body>
</html>
